<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6a43" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BubbleCycle" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="description" content="BubbleCycle — find recycling stations, discover sustainable treats, scan packaging and earn rewards. Demo MVP for Switzerland." />
  <title>BubbleCycle</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%231f6a43'/%3E%3Cpath d='M20 36c0-9 6-14 16-14 0 9-5 15-14 15z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="vendor/fonts/fonts.css" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <script src="vendor/leaflet/leaflet.js"></script>
</head>
<body>
  <div id="app">
    <div class="boot">
      <div class="boot-bubble"></div>
      <p>Blowing bubbles…</p>
    </div>
  </div>
  <noscript><p style="padding:24px">BubbleCycle needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
  <script>
    // Offline support + install prompt. Works on localhost and on https.
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; window.dispatchEvent(new Event('bc-installable')); });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
  <script>
    // If the app module fails to load (e.g. offline, opened via file://), show a helpful message.
    setTimeout(function () {
      var boot = document.querySelector('.boot');
      if (boot) boot.innerHTML = '<p><strong>BubbleCycle couldn’t start.</strong><br>Open it through the launcher (start.bat, start.sh) or <code>python serve.py</code> rather than double-clicking index.html: browsers block ES modules from file:// pages.</p>';
    }, 8000);
  </script>
</body>
</html>
