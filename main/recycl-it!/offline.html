<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2a33a" />
  <title>RECYCL IT! is offline</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 32px 16px; background: #faf7f0; color: #26231d; line-height: 1.5; }
    main { max-width: 32rem; margin: 0 auto; }
    h1 { font-size: 1.4rem; }
    button { font: inherit; padding: 12px 18px; border-radius: 6px; border: 0; background: #1f6a43; color: #fff; min-height: 44px; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="" width="72" height="72" style="border-radius:16px" />
    <h1>You’re offline</h1>
    <p>RECYCL IT! couldn’t be loaded because this device has no connection and the app hasn’t been saved here yet. Connect once and open it again; after that it opens without a connection.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
