# HTTPS staging on any small server with a domain name pointing at it: the app behind Caddy, which gets and renews
# the certificate by itself. Nothing is started or published until you run it.
#   cp .env.example .env     # then fill in the domain and secrets
#   docker compose -f deploy/docker-compose.staging.yml --env-file .env up -d --build
services:
  app:
    build: ..
    env_file: ../.env
    environment:
      BC_HOST: 0.0.0.0
      BC_PORT: "8080"
      BC_DB: /data/bubblecycle.db
    volumes:
      - app-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-data:
  caddy-data:
